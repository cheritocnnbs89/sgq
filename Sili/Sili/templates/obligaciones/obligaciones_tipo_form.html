{% extends "base.html" %}
{% block title %}Obligaciones - {{ 'Editar' if mode == 'edit' else 'Nuevo' }} tipo{% endblock %}

{% block content %}
<div class="container-fluid">
  <h4 class="mb-3"><i class="bi bi-tags"></i> {{ 'Editar' if mode == 'edit' else 'Nuevo' }} tipo</h4>

  <form method="post" action="{{ url_for('obligaciones.editar_tipo', tipo_id=tipo_id) if mode == 'edit' else url_for('obligaciones.nuevo_tipo') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card mb-3">
      <div class="card-header">Datos generales</div>
      <div class="card-body row g-3">
        <div class="col-md-8">
          <label class="form-label">Nombre *</label>
          <input type="text" name="nombre" class="form-control" maxlength="200" required
                 value="{{ tipo.get('nombre', '') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Orden</label>
          <input type="number" min="0" name="orden" class="form-control" value="{{ tipo.get('orden') or 0 }}">
          <small class="text-muted">Determina el orden en los combos.</small>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn-cta-blue"><i class="bi bi-check-lg"></i> Guardar</button>
      <a href="{{ url_for('obligaciones.lista_tipos') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
