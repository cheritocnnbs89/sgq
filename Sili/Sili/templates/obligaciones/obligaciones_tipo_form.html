{% extends "base.html" %}
{% block title %}Obligaciones - {{ 'Editar' if mode == 'edit' else 'Nuevo' }} tipo{% endblock %}

{% block content %}
<div class="container-fluid">
  <h4 class="mb-3"><i class="bi bi-tags"></i> {{ 'Editar' if mode == 'edit' else 'Nuevo' }} tipo</h4>

  <form method="post" action="{{ url_for('obligaciones.editar_tipo', tipo_id=tipo_id) if mode == 'edit' else url_for('obligaciones.nuevo_tipo') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card mb-3">
      <div class="card-header">Datos generales</div>
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label">Nombre *</label>
          <input type="text" name="nombre" class="form-control" maxlength="100" required
                 value="{{ tipo.get('nombre', '') }}">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Guardar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('obligaciones.lista_tipos') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
