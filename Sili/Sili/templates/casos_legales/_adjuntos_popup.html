{% if adjuntos %}
<div class="list-group">
  {% for a in adjuntos %}
  <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
     href="{{ url_for('casos_legales.casos_adjunto', adjunto_id=a.id) }}" target="_blank" rel="noopener">
    <span class="text-truncate">
      <i class="bi bi-paperclip me-2"></i>{{ a.nombre_original }}
      <span class="text-muted small ms-1">({{ (a.tamano / 1024) | round(1) }} KB)</span>
    </span>
    <span class="badge bg-primary rounded-pill">Abrir</span>
  </a>
  {% endfor %}
</div>
<small class="text-muted d-block mt-2">Se abrirán en una nueva pestaña.</small>
{% else %}
<div class="text-muted">Sin adjuntos.</div>
{% endif %}
